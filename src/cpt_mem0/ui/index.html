<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cpt Mem0</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<!-- Die Kopfzeile: Status, VRAM, der grosse Schalter -->
<header class="bar">
  <div class="brand">
    <span class="logo">CPT<em>MEM0</em></span>
    <span class="build" id="build">–</span>
  </div>

  <div class="meters">
    <div class="meter">
      <span class="meter-label">VRAM</span>
      <span class="meter-value" id="vram">–</span>
      <div class="meter-bar"><span id="vram-bar"></span></div>
    </div>
    <div class="meter" title="Was diese App auf der Karte belegt - ohne das, was andere Programme dort brauchen">
      <span class="meter-label">VRAM APP</span>
      <span class="meter-value" id="vram-app">–</span>
    </div>
    <div class="meter">
      <span class="meter-label">FAKTEN</span>
      <span class="meter-value" id="memories">–</span>
    </div>
    <div class="meter">
      <span class="meter-label">MODELLE</span>
      <span class="meter-value" id="models">–</span>
    </div>
  </div>

  <button class="power" id="power" title="Modelle ein- und ausschalten">
    <span class="power-ring"></span>
    <span class="power-label">AUS</span>
  </button>
</header>

<!-- Die Themen-Tasten: wie ein Equalizer -->
<nav class="topics" id="topics"></nav>

<!-- Die Themen, die der User gemerkt hat: sie bleiben, wenn es mehr
     Themen gibt als Knöpfe. -->
<div class="favourites" id="favourites" hidden>
  <span class="favourites-label">Deine Themen</span>
  <div class="favourites-list" id="favourites-list"></div>
</div>

<!-- Die Chat-Zeile -->
<main class="chat">
  <div class="messages" id="messages"></div>

  <form class="composer" id="composer">
    <input type="text" id="input" autocomplete="off" spellcheck="false"
           placeholder="Sag etwas – es wird gemerkt.">
    <button type="submit" class="send" title="Senden">↵</button>
  </form>

  <div class="statusline" id="statusline"></div>

  <!-- Das Cockpit: die Instrumente unten rechts. -->
  <div class="cockpit" id="cockpit">
    <div class="dial">
      <span class="dial-value" id="tps">–</span>
      <span class="dial-label">Token/s</span>
    </div>
    <div class="dial">
      <span class="dial-value" id="gpu-percent">–</span>
      <span class="dial-label" id="gpu-name">GPU</span>
    </div>
    <div class="dial">
      <span class="dial-value" id="vram-percent">–</span>
      <span class="dial-label">VRAM</span>
      <div class="dial-bar"><span id="cockpit-vram-bar"></span></div>
    </div>
    <div class="dial lamp" id="cockpit-power" title="Inference">
      <span class="lamp-dot"></span>
      <span class="dial-label" id="cockpit-power-label">Aus</span>
    </div>
  </div>
</main>

<!-- Die Einstellungen -->
<footer class="settings">
  <div class="setting">
    <label for="model">Modell</label>
    <select id="model"></select>
  </div>

  <div class="setting switch">
    <label for="autostart">Autostart (Windows)</label>
    <button type="button" class="toggle" id="autostart" role="switch"
            aria-checked="false"><span></span></button>
  </div>

  <div class="setting switch">
    <label for="voice">Sprachausgabe</label>
    <button type="button" class="toggle" id="voice" role="switch"
            aria-checked="false"><span></span></button>
  </div>

  <div class="setting">
    <label for="voice-name">Stimme</label>
    <select id="voice-name"><option value="">–</option></select>
  </div>

  <div class="setting">
    <label for="model-folder">Modelle</label>
    <button type="button" id="pick-folder">Ordner wählen</button>
    <button type="button" id="show-models">Vorschläge</button>
    <span class="path" id="model-folder-path"></span>
  </div>

  <div class="setting danger-zone">
    <span class="label">Daten</span>
    <button type="button" class="danger" id="wipe">Alle Erinnerungen löschen</button>
  </div>
</footer>

<!-- Die Modellvorschlaege: was passt auf die Karte, und wo es her
     kommt. -->
<dialog class="model-dialog" id="model-dialog">
  <div class="model-head">
    <h2>Modelle für deine Karte</h2>
    <button type="button" class="close" id="model-close">×</button>
  </div>
  <p class="model-hint" id="model-hint"></p>
  <div class="model-list" id="model-list"></div>
</dialog>

<script src="/ui/app.js"></script>
</body>
</html>
