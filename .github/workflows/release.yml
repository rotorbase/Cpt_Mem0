name: Release

# The Windows package is built when a release is published and hung
# on it as an asset, so the download comes straight from the repository
# page.
#
# The build runs on windows-latest - the package is a Windows binary
# and cannot be built anywhere else.
#
# The llama.cpp build is NOT in the package. It is 700 MB with the
# CUDA runtime, and `cpt-mem0 init` downloads it separately, pinned to
# an exact build. It belongs on the disk of the machine, not in a zip
# that every user has to download.

on:
  release:
    types: [published]
  # A tag builds the package too. The release page is where the
  # download belongs, but a fix that comes after the release was
  # published has to reach it somehow - and a new tag is the way.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the package
        # The specification uses the source tree as the base. The
        # package is not installed - it is built from the sources.
        env:
          PYTHONPATH: src
        run: python packaging/build_windows.py

      - name: Check the package starts
        # The exe has to start and answer.
        #
        # **The exit code of `status` is not always 0.** It reports
        # "not running" with its own code when there is no daemon -
        # and on the runner there is none. The check looks at what
        # the exe printed, not at the exit code.
        shell: pwsh
        run: |
          $exe = "dist\Cpt_Mem0\Cpt_Mem0.exe"
          if (-not (Test-Path $exe)) { throw "no exe" }

          # The exe is a windowed program: it has no console, so its
          # output goes nowhere unless it is redirected into a file.
          # A pipe would capture nothing.
          & $exe --help > help.txt 2>&1
          if ($LASTEXITCODE -ne 0) { throw "the exe returned $LASTEXITCODE" }
          $help = Get-Content help.txt -Raw
          if ($help -notmatch "ui") {
            throw "the exe printed nothing useful: $help"
          }
          Write-Host "the exe starts and knows its commands"

          & $exe status > status.txt 2>&1
          $status = Get-Content status.txt -Raw
          if ($status -notmatch "daemon:") {
            throw "the exe printed nothing useful: $status"
          }
          Write-Host "the exe reports the state"
          Write-Host $status

      - name: Keep the test output
        # When the tests fail on the runner, the log has to be
        # somewhere. Without this the only clue is "exit code 1".
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: Cpt_Mem0-windows-x64
          path: |
            dist/Cpt_Mem0-*-windows-x64.zip
            dist/Cpt_Mem0-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        shell: pwsh
        run: |
          # The release may not exist yet - a tag that was pushed
          # without a release gets one here.
          if (-not (gh release view $env:GITHUB_REF_NAME 2>$null)) {
            Write-Host "creating the release $env:GITHUB_REF_NAME"
            gh release create $env:GITHUB_REF_NAME --generate-notes `
              --title $env:GITHUB_REF_NAME
          }

          $assets = Get-ChildItem "dist\Cpt_Mem0-*-windows-x64.zip"
          foreach ($asset in $assets) {
            Write-Host "attaching $($asset.Name)"
            gh release upload $env:GITHUB_REF_NAME $asset.FullName --clobber
          }
          $digest = Get-ChildItem "dist\Cpt_Mem0-*-windows-x64.zip.sha256"
          foreach ($asset in $digest) {
            gh release upload $env:GITHUB_REF_NAME $asset.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ github.token }}
