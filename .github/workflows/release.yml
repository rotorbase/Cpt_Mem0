name: Release

# The Windows package is built when a release is published and hung
# on it as an asset, so the download comes straight from the repository
# page.
#
# The build runs on windows-latest - the package is a Windows binary
# and cannot be built anywhere else.
#
# The llama.cpp build is NOT in the package. It is 700 MB with the
# CUDA runtime, and `cpt-mem0 init` downloads it separately, pinned to
# an exact build. It belongs on the disk of the machine, not in a zip
# that every user has to download.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the package
        run: python packaging/build_windows.py

      - name: Check the package starts
        # The exe must at least start and answer. The window needs a
        # desktop, so the check is the daemon behind it.
        shell: pwsh
        run: |
          $exe = "dist\Cpt_Mem0\Cpt_Mem0.exe"
          if (-not (Test-Path $exe)) { throw "no exe" }
          $process = Start-Process -FilePath $exe -ArgumentList "status" -PassThru -NoNewWindow
          $process.WaitForExit(60000) | Out-Null
          if ($process.ExitCode -ne 0) { throw "the exe returned $($process.ExitCode)" }
          Write-Host "the exe starts"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: Cpt_Mem0-windows-x64
          path: |
            dist/Cpt_Mem0-*-windows-x64.zip
            dist/Cpt_Mem0-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $assets = Get-ChildItem "dist\Cpt_Mem0-*-windows-x64.zip"
          foreach ($asset in $assets) {
            Write-Host "attaching $($asset.Name)"
            gh release upload $env:GITHUB_REF_NAME $asset.FullName --clobber
          }
          $digest = Get-ChildItem "dist\Cpt_Mem0-*-windows-x64.zip.sha256"
          foreach ($asset in $digest) {
            gh release upload $env:GITHUB_REF_NAME $asset.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ github.token }}
