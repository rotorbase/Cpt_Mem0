name: CI

# The tests on every push. They need no GPU and no model: the
# hardware checks are separate and manual, because the card belongs
# to whoever is working on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The package is not installed - it is used from the source tree.
  PYTHONPATH: src

jobs:
  tests:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: The tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          python -m pytest tests/ -q --tb=short -ra 2>&1 |
            Tee-Object -FilePath results/pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The log has to be readable from outside the runner.
            # GitHub shows an annotation on the check run - and the
            # annotation can be read without a token.
            $tail = (Get-Content results/pytest.txt -Tail 60) -join "`n"
            $tail = $tail -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=The tests failed::$tail"
          }
          exit $code

      - name: Keep the test output
        # When the tests fail on the runner, the log has to be
        # somewhere. Without this the only clue is "exit code 1".
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: results/
          if-no-files-found: ignore
          retention-days: 7

      - name: The linter
        run: |
          pip install ruff
          ruff check src/cpt_mem0/ scripts/ tests/

      - name: The catalogue is consistent
        run: python -m cpt_mem0.cli validate-catalogue

      - name: Check that nothing personal is in the repository
        # The same script that runs locally. A scan that only exists
        # in one place gets out of step - and the first version of
        # this one missed four paths because it looked for C:/Users/
        # while Windows writes C:\Users\.
        run: python scripts/leak_scan.py

