name: CI

# The tests on every push. They need no GPU and no model: the
# hardware checks are separate and manual, because the card belongs
# to whoever is working on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The package is not installed - it is used from the source tree.
  PYTHONPATH: src

jobs:
  tests:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: The tests
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          python -m pytest tests/ -q --tb=short -ra 2>&1 |
            Tee-Object -FilePath results/pytest.txt
          exit $LASTEXITCODE

      - name: Keep the test output
        # When the tests fail on the runner, the log has to be
        # somewhere. Without this the only clue is "exit code 1".
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: results/
          if-no-files-found: ignore
          retention-days: 7

      - name: The linter
        run: |
          pip install ruff
          ruff check src/cpt_mem0/ scripts/ tests/

      - name: The catalogue is consistent
        run: python -m cpt_mem0.cli validate-catalogue

      - name: Check that nothing personal is in the repository
        shell: pwsh
        run: |
          $hits = Select-String -Path (Get-ChildItem -Recurse -File -Include *.py,*.md,*.json,*.yml,*.html,*.js,*.css | Where-Object { $_.FullName -notmatch "\\\.git\\|\\dist\\|\\build\\|\\\.venv\\" }) -Pattern "C:\\\\Users\\\\[a-z]+|/home/[a-z]+/|sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}" -AllMatches
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "there is something personal in the repository"
          }
          Write-Host "clean"
