[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpt-mem0"
version = "0.1.0"
description = "Self-contained local mem0 memory service for consumer GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cpt_Mem0 contributors" }]
keywords = ["mem0", "llama.cpp", "local-llm", "memory", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mem0ai==2.2.1",
    "qdrant-client>=1.19",
    "fastembed>=0.3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cpt-mem0 = "cpt_mem0.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpt_mem0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU and loads models - not part of the default test run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
